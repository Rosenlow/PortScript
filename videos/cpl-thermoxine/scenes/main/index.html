<script>
const C = window.CUES, END = C.end;
const tl = gsap.timeline({ paused: true });
const ease = "power3.out";
gsap.set("#st1,#st2,#gauge,#prodTitle,#bottle,.tag,#badge,#endTitle,#url,#disclaimer", { opacity: 0 });

// ---- S2: stickers on their words, hunger gauge to max ----
slam("#st1", C.s2, 1.6, -8); slam("#st2", C.ara, 1.6, 7);
slam("#gauge", C.bitmeyen - 0.05, 1.3);

shake(C.bitmeyen + 0.05, 10);
